name = "office-supply-analytics"
main = "src/index.js"
compatibility_date = "2025-04-01"

# =====================================================
# Cloudflare D1 数据库绑定
# 首次部署前请先在 Cloudflare Dashboard 中创建 D1 数据库：
#   wrangler d1 create office-supply-db
# 然后将你的 database_id 填入下方
# =====================================================
[[d1_databases]]
binding = "DB"
database_name = "office-supply-db"
database_id = "bb0f6892-bc94-42c2-ac18-5aa20e855b77"

# 静态资源目录（前端 SPA）
[assets]
directory = "./public"
